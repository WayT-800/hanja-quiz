<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한자 퀴즈 1인용</title>
<style>
:root{
  --bg1:#081126;
  --bg2:#142249;
  --card:#17264f;
  --card2:#213362;
  --text:#f8faff;
  --muted:#b8c3e5;
  --line:rgba(255,255,255,.16);
  --cyan:#42d9ff;
  --green:#48df9c;
  --yellow:#ffd84d;
  --orange:#ff9d45;
  --red:#ff6677;
  --purple:#917cff;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:
    radial-gradient(circle at 50% 115%,rgba(89,111,255,.22),transparent 42%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.screen{
  width:100vw;height:100vh;min-height:520px;position:relative;overflow:hidden;
}
.screen:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background-image:
    linear-gradient(30deg,transparent 24%,rgba(255,255,255,.11) 25%,transparent 26%),
    linear-gradient(150deg,transparent 24%,rgba(255,255,255,.08) 25%,transparent 26%);
  background-size:60px 60px;
}

/* INTRO */
#intro,#result{
  position:relative;z-index:1;height:100%;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.panel{
  width:min(860px,96vw);
  max-height:94vh;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:30px;
  background:rgba(10,17,42,.92);
  padding:28px;
  box-shadow:0 22px 65px rgba(0,0,0,.34);
}
.brand{
  display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:24px;
}
.logo{
  width:72px;height:72px;border-radius:22px;display:grid;place-items:center;
  font-size:40px;font-weight:1000;
  background:linear-gradient(135deg,#6874ff,#29c8ff);
  border:2px solid rgba(255,255,255,.24);
}
.brand h1{margin:0;font-size:clamp(34px,6vw,58px);letter-spacing:-2px}
.brand p{margin:3px 0 0;color:var(--muted);font-weight:800}
.setting-grid{display:grid;gap:14px}
.setting-row{
  display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;
  border:1px solid var(--line);border-radius:18px;padding:13px 15px;
  background:rgba(255,255,255,.035);
}
.setting-title{font-size:19px;font-weight:1000}
.seg{display:flex;gap:9px;flex-wrap:wrap}
.seg button{
  min-width:92px;min-height:52px;padding:8px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.17);background:#1d2b56;color:white;
  font-size:17px;font-weight:1000;cursor:pointer;
}
.seg button.active{
  background:linear-gradient(135deg,#5968ff,#29c0ff);
  border-color:#99eaff;
  box-shadow:0 0 0 3px rgba(67,215,255,.12) inset;
}
.sound-row{
  margin-top:15px;padding:12px 15px;border:1px dashed var(--line);border-radius:16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:rgba(255,255,255,.025);
}
.toggle{display:flex;align-items:center;gap:9px;font-weight:900}
.toggle input{width:22px;height:22px}
.sound-row small{color:var(--muted);font-weight:700}
.start-wrap{display:flex;justify-content:center;margin-top:20px}
#startBtn{
  min-width:300px;min-height:68px;border:0;border-radius:20px;cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--orange));
  color:#141414;font-size:27px;font-weight:1000;
  box-shadow:0 9px 0 #b7661e,0 16px 28px rgba(0,0,0,.26);
}
#startBtn:active{transform:translateY(3px);box-shadow:0 6px 0 #b7661e}

/* GAME */
#game{position:relative;z-index:1;height:100%;padding:14px}
.game-shell{
  width:min(1100px,100%);
  height:100%;
  margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:10px;
}
.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  min-height:50px;
}
.top-left,.top-right{display:flex;align-items:center;gap:9px}
.top-right{justify-content:flex-end}
.pill{
  min-height:40px;display:flex;align-items:center;
  padding:7px 13px;border:1px solid var(--line);border-radius:999px;
  background:rgba(9,15,35,.7);font-weight:1000;color:#edf2ff;
}
#roundIndicator{font-size:18px}
.score{font-size:17px}
#soundChip{
  border:1px solid var(--line);border-radius:999px;background:rgba(9,15,35,.7);
  color:white;min-height:40px;padding:7px 13px;font-weight:900;cursor:pointer;
}
.quiz-card{
  min-height:0;
  display:grid;
  grid-template-rows:minmax(130px,38%) minmax(0,1fr) auto;
  gap:12px;
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(15,24,54,.88);
  padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.23);
}
.question-area{
  min-height:0;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.11);
  padding:16px;
}
.question.hanja{
  font-size:clamp(82px,15vw,160px);font-weight:1000;line-height:1;
  text-shadow:0 5px 0 rgba(0,0,0,.25);
}
.question.reading{
  font-size:clamp(34px,6vw,70px);font-weight:1000;line-height:1.14;letter-spacing:-2px;
}
.answers{
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:12px;
}
.answer{
  min-width:0;min-height:82px;
  touch-action:none;-ms-touch-action:none;
  border:2px solid rgba(255,255,255,.18);
  border-radius:20px;
  background:linear-gradient(180deg,#263867,#18264f);
  color:white;
  padding:10px 12px;
  font-size:clamp(24px,4vw,42px);
  font-weight:1000;
  line-height:1.12;
  white-space:normal;
  cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
}
.answer.hanja-choice{font-size:clamp(48px,8vw,86px)}
.answer:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.answers.locked .answer{pointer-events:none}
.answer.correct-answer{
  background:linear-gradient(180deg,#43e0a2,#149269);
  border-color:#b7ffe5;color:#061d16;
}
.answer.chosen-wrong{
  background:linear-gradient(180deg,#ff7180,#b93249);
  border-color:#ffc6cd;color:white;
}
.answer.chosen-correct{
  outline:5px solid white;outline-offset:-6px;
}
.timebar-shell{
  height:16px;background:rgba(0,0,0,.33);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;overflow:hidden;
}
.timebar{
  width:100%;height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  transition:width .08s linear,background .12s;
}
.timebar.urgent{background:linear-gradient(90deg,var(--red),var(--yellow))}
.feedback{
  position:absolute;left:50%;top:49%;
  transform:translate(-50%,-50%) scale(.9);
  min-width:170px;padding:13px 22px;border-radius:999px;
  background:rgba(7,13,31,.92);
  border:2px solid rgba(255,255,255,.24);
  text-align:center;font-size:24px;font-weight:1000;
  opacity:0;pointer-events:none;
  transition:.16s;
  z-index:5;
}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.feedback.ok{border-color:var(--green)}
.feedback.no{border-color:var(--red)}
.feedback.timeout{border-color:var(--yellow)}

/* RESULT */
.result-card{text-align:center}
.result-card h2{
  margin:0;font-size:clamp(42px,7vw,70px);letter-spacing:-2px;
}
.result-sub{margin:7px 0 22px;color:#e3e9ff;font-size:20px;font-weight:900}
.result-score{
  width:min(440px,90%);margin:0 auto 18px;
  border:1px solid var(--line);border-radius:26px;padding:22px;
  background:linear-gradient(180deg,#1c2c5a,#152348);
}
.big-score{font-size:clamp(54px,10vw,96px);font-weight:1000;line-height:1}
.result-detail{margin-top:12px;font-size:22px;font-weight:900;color:#eef2ff}
.grade{
  display:inline-block;margin-top:16px;padding:9px 18px;border-radius:999px;
  background:linear-gradient(135deg,var(--yellow),var(--orange));
  color:#171717;font-size:21px;font-weight:1000;
}
.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.result-actions button{
  min-height:56px;padding:10px 22px;border-radius:16px;
  border:1px solid var(--line);background:#243562;color:white;
  font-size:18px;font-weight:1000;cursor:pointer;
}
.result-actions .primary{
  background:linear-gradient(135deg,var(--yellow),var(--orange));border:0;color:#151515;
}
#confettiLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.confetti{
  position:absolute;top:-28px;width:13px;height:21px;border-radius:3px;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0)}
  100%{transform:translateY(110vh) rotate(720deg)}
}

@media (orientation:portrait){
  #game{padding:10px}
  .quiz-card{
    grid-template-rows:minmax(150px,32%) minmax(0,1fr) auto;
    padding:13px;gap:9px;
  }
  .answers{
    grid-template-columns:1fr;
    grid-template-rows:repeat(4,1fr);
    gap:8px;
  }
  .answer{min-height:62px;font-size:clamp(22px,5vw,34px)}
  .answer.hanja-choice{font-size:clamp(42px,10vw,66px)}
}
@media(max-width:680px){
  .panel{padding:20px 15px}
  .setting-row{grid-template-columns:1fr}
  .setting-title{font-size:17px}
  .seg button{min-width:80px;min-height:48px;font-size:15px}
  .sound-row{align-items:flex-start;flex-direction:column}
  .topbar{grid-template-columns:1fr auto}
  .topbar .top-center{display:none}
}
</style>
</head>
<body>
<div class="screen">
  <div id="confettiLayer" class="hidden"></div>

  <section id="intro">
    <div class="panel">
      <div class="brand">
        <div class="logo">漢</div>
        <div>
          <h1>한자 퀴즈</h1>
          <p>패드 1인용</p>
        </div>
      </div>

      <div class="setting-grid">
        <div class="setting-row">
          <div class="setting-title">학습 범위</div>
          <div class="seg" data-setting="part">
            <button type="button" data-value="1">1부</button>
            <button type="button" data-value="2">2부</button>
            <button type="button" data-value="3">3부</button>
            <button type="button" class="active" data-value="all">전체</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-title">문제 유형</div>
          <div class="seg" data-setting="mode">
            <button type="button" data-value="reading">훈음</button>
            <button type="button" data-value="hanja">한자</button>
            <button type="button" class="active" data-value="mixed">혼합</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-title">제한시간</div>
          <div class="seg" data-setting="time">
            <button type="button" data-value="0">없음</button>
            <button type="button" data-value="5">5초</button>
            <button type="button" class="active" data-value="10">10초</button>
            <button type="button" data-value="15">15초</button>
            <button type="button" data-value="20">20초</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-title">문제 수</div>
          <div class="seg" data-setting="count">
            <button type="button" data-value="5">5</button>
            <button type="button" class="active" data-value="10">10</button>
            <button type="button" data-value="20">20</button>
            <button type="button" data-value="30">30</button>
            <button type="button" data-value="all">전체</button>
          </div>
        </div>
      </div>

      <div class="sound-row">
        <label class="toggle">
          <input id="soundEnabled" type="checkbox" checked>
          <span>효과음 · 배경음악</span>
        </label>
        <small>게임 시작을 눌러야 소리가 시작됩니다.</small>
      </div>

      <div class="start-wrap">
        <button id="startBtn" type="button">게임 시작</button>
      </div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="game-shell">
      <div class="topbar">
        <div class="top-left">
          <div id="roundIndicator" class="pill">1 / 10</div>
          <div id="scoreIndicator" class="pill score">0점</div>
        </div>
        <div class="top-center"></div>
        <div class="top-right">
          <button id="soundChip" type="button">🔊 소리 ON</button>
        </div>
      </div>

      <div class="quiz-card">
        <div class="question-area">
          <div id="question" class="question hanja">天</div>
        </div>
        <div id="answers" class="answers"></div>
        <div class="timebar-shell"><div id="timebar" class="timebar"></div></div>
      </div>

      <div id="feedback" class="feedback">정답!</div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="panel result-card">
      <h2>축하합니다!</h2>
      <div class="result-sub">한자 퀴즈 결과</div>
      <div class="result-score">
        <div id="finalScore" class="big-score">900점</div>
        <div id="finalDetail" class="result-detail">9 / 10 정답 · 정답률 90%</div>
        <div id="grade" class="grade">한자 마스터!</div>
      </div>
      <div class="result-actions">
        <button id="replayBtn" class="primary" type="button">같은 설정으로 다시하기</button>
        <button id="homeBtn" type="button">처음으로</button>
      </div>
    </div>
  </section>

    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function poolForPart(){
    if(settings.part==="1")return PART1;
    if(settings.part==="2")return PART2;
    if(settings.part==="3")return PART3;
    return ALL;
  }

  async function startGame(){
    stopTimer();clearConfetti();
    settings.sound=soundEnabledEl.checked;
    if(settings.sound){
      await Sound.enable();
      await Sound.unlockAndStart();
    }else Sound.disable();

    const pool=poolForPart();
    const grouped=groupQuestions(pool);
    const requested=settings.count==="all"?grouped.length:Math.min(settings.count,grouped.length);
    const questions=shuffle(grouped).slice(0,requested);

    state={
      pool,
      questions,
      index:0,
      score:0,
      correct:0,
      revealed:false,
      startedAt:0,
      currentType:null
    };

    intro.classList.add("hidden");
    result.classList.add("hidden");
    game.classList.remove("hidden");
    Sound.startBgm();
    renderQuestion();
  }

  function goHome(){
    stopTimer();clearConfetti();Sound.stopBgm();
    game.classList.add("hidden");
    result.classList.add("hidden");
    intro.classList.remove("hidden");
  }

  // 같은 글자(예: 金, 北)는 하나의 문제 항목으로 묶는다.
  function groupQuestions(pool){
    const map=new Map();
    for(const [h,r] of pool){
      if(!map.has(h))map.set(h,[]);
      if(!map.get(h).includes(r))map.get(h).push(r);
    }
    return [...map.entries()].map(([hanja,readings])=>({hanja,readings}));
  }

  function chooseType(){
    if(settings.mode==="mixed")return Math.random()<.5?"reading":"hanja";
    return settings.mode;
  }

  function renderQuestion(){
    stopTimer();
    state.revealed=false;
    feedback.className="feedback";
    timebar.style.width="100%";
    timebar.classList.remove("urgent");
    answersEl.classList.remove("locked");
    answersEl.innerHTML="";

    const item=state.questions[state.index];
    state.currentType=chooseType();

    roundIndicator.textContent=`${state.index+1} / ${state.questions.length}`;
    scoreIndicator.textContent=`${state.score}점`;

    if(state.currentType==="reading"){
      questionEl.className="question hanja";
      questionEl.textContent=item.hanja;
    }else{
      questionEl.className="question reading";
      questionEl.textContent=item.readings.join(" · ");
    }

    const options=shuffle(buildOptions(item,state.currentType));
    options.forEach(option=>{
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="answer"+(state.currentType==="hanja"?" hanja-choice":"");
      btn.textContent=option.label;
      btn.dataset.correct=option.correct?"1":"0";
      bindAnswer(btn,option);
      answersEl.appendChild(btn);
    });

    state.startedAt=performance.now();
    if(settings.time>0)startTimer();
  }

  function buildOptions(item,type){
    const grouped=groupQuestions(state.pool);

    if(type==="reading"){
      const correctLabel=item.readings.join(" · ");
      const candidates=grouped
        .filter(x=>x.hanja!==item.hanja)
        .map(x=>({label:x.readings.join(" · "),correct:false}));
      return [{label:correctLabel,correct:true},...shuffle(candidates).slice(0,3)];
    }

    const correctLabel=item.hanja;
    // 현재 훈음과 겹치는 다른 한자가 있을 경우 오답 후보에서 제외
    const currentReadings=new Set(item.readings);
    const candidates=grouped
      .filter(x=>x.hanja!==item.hanja)
      .filter(x=>!x.readings.some(r=>currentReadings.has(r)))
      .map(x=>({label:x.hanja,correct:false}));
    return [{label:correctLabel,correct:true},...shuffle(candidates).slice(0,3)];
  }

  function bindAnswer(button,option){
    const act=e=>{
      if(e.cancelable)e.preventDefault();
      e.stopPropagation();
      selectAnswer(button,option);
    };
    if(window.PointerEvent){
      button.addEventListener("pointerdown",act,{passive:false});
    }else{
      button.addEventListener("touchstart",act,{passive:false});
      button.addEventListener("mousedown",act);
    }
  }

  function selectAnswer(button,option){
    if(state.revealed)return;
    state.revealed=true;
    stopTimer();
    answersEl.classList.add("locked");
    Sound.click();

    const buttons=[...answersEl.querySelectorAll(".answer")];
    buttons.forEach(b=>{
      if(b.dataset.correct==="1")b.classList.add("correct-answer");
    });

    if(option.correct){
      button.classList.add("chosen-correct");
      state.score+=100;
      state.correct++;
      showFeedback("정답!","ok");
    }else{
      button.classList.add("chosen-wrong");
      showFeedback("아쉬워!","no");
    }

    scoreIndicator.textContent=`${state.score}점`;
    Sound.reveal();
    setTimeout(nextQuestion,1150);
  }

  function timeoutReveal(){
    if(state.revealed)return;
    state.revealed=true;
    stopTimer();
    answersEl.classList.add("locked");
    [...answersEl.querySelectorAll(".answer")].forEach(b=>{
      if(b.dataset.correct==="1")b.classList.add("correct-answer");
    });
    showFeedback("시간초과","timeout");
    Sound.reveal();
    setTimeout(nextQuestion,1250);
  }

  function showFeedback(text,kind){
    feedback.textContent=text;
    feedback.className=`feedback show ${kind}`;
  }

  function nextQuestion(){
    state.index++;
    if(state.index>=state.questions.length)showResult();
    else renderQuestion();
  }

  function startTimer(){
    const duration=settings.time*1000;
    Sound.tickingMark=Math.ceil(settings.time);
    const tick=now=>{
      if(state.revealed)return;
      const elapsed=now-state.startedAt;
      const remain=Math.max(0,duration-elapsed);
      const ratio=remain/duration;
      timebar.style.width=`${ratio*100}%`;
      const sec=Math.ceil(remain/1000);

      if(sec<=3&&sec>=1){
        timebar.classList.add("urgent");
        if(sec!==Sound.tickingMark){
          Sound.tickingMark=sec;
          Sound.tick();
        }
      }else timebar.classList.remove("urgent");

      if(remain<=0){
        timeoutReveal();
        return;
      }
      rafId=requestAnimationFrame(tick);
    };
    rafId=requestAnimationFrame(tick);
    timerId=setTimeout(timeoutReveal,duration+80);
  }

  function stopTimer(){
    if(timerId){clearTimeout(timerId);timerId=null}
    if(rafId){cancelAnimationFrame(rafId);rafId=null}
  }

  function showResult(){
    stopTimer();
    game.classList.add("hidden");
    result.classList.remove("hidden");
    Sound.fanfare();
    spawnConfetti(80);

    const total=state.questions.length;
    const pct=Math.round((state.correct/total)*100);
    document.getElementById("finalScore").textContent=`${state.score}점`;
    document.getElementById("finalDetail").textContent=`${state.correct} / ${total} 정답 · 정답률 ${pct}%`;

    let grade="조금 더 연습!";
    if(pct>=90)grade="한자 마스터!";
    else if(pct>=70)grade="아주 좋아!";
    else if(pct>=50)grade="좋은 도전!";
    document.getElementById("grade").textContent=grade;
  }

  function spawnConfetti(count){
    clearConfetti();
    confettiLayer.classList.remove("hidden");
    const colors=["#ffd84d","#ff6677","#48df9c","#42d9ff","#917cff","#fff"];
    for(let i=0;i<count;i++){
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=`${Math.random()*100}%`;
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration=`${3+Math.random()*2.2}s`;
      c.style.animationDelay=`${Math.random()*.8}s`;
      confettiLayer.appendChild(c);
    }
  }
  function clearConfetti(){
    confettiLayer.innerHTML="";
    confettiLayer.classList.add("hidden");
  }
})();
</script>
</body>
</html>
